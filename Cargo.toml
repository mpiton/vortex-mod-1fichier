[package]
name = "vortex-mod-1fichier"
version = "1.1.0"
edition = "2021"
description = "1fichier hoster WASM plugin for Vortex — free (60s wait + captcha stub) and premium (API key)"
license = "GPL-3.0"
authors = ["vortex-community"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.13.1"
thiserror = "2.0.20"

[dev-dependencies]
extism = "=1.30.0"
rstest = "0.26.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
